name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Carregar secrets do backend
        shell: bash
        run: |
          cat <<'EOF' >> "$GITHUB_ENV"
          ${{ secrets.YOUR_SECRETS_ANIME }}
          EOF

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Executar testes
        working-directory: backend
        run: npm test