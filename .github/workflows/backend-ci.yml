name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/centraldeanimetest
      DATABASE_URL_UNPOOLED: postgresql://postgres:ci-only-password@localhost:5432/centraldeanimetest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Preparar ambiente isolado sem conexao
        working-directory: backend
        run: npm run env:prepare

      - name: Build e verificacao de tipos sem banco
        working-directory: backend
        run: npm run build

      - name: Executar testes com conexoes PostgreSQL bloqueadas
        working-directory: backend
        run: npm run test:ci
